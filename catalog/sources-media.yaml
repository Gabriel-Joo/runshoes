        why: '약관 4절은 have not been approved by the Wikimedia community 인 자동 이용을 막는다. 이 「approved by the Wikimedia community」를 Robot policy(약관 12절이 끌어옴) 준수로 읽은 것은 해석이다 — 우리 UA 를 밝히고, robots 를 지키고, 초당 20회 미만(우리는 5초 1회, 동시 1)으로 읽으면 승인된 이용이라고 보았다(2026-11-15 사용자). 모든 자동 이용에 따로 승인이 필요하다고 읽을 여지가 있고, 그렇게 보면 열 수 없다'
      - claim: 'robots 가 막지 않는다'
        kind: 원문
        why: '우리 UA 에 맞는 이름 그룹이 없고 * 그룹은 /w/, /api/, /trap/, /wiki/Special: 등만 막는다'
      - claim: '사실은 쓴다'
