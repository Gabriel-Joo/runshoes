# 매체 · 보도자료 수집처 — 2단계(공식몰에서 못 받는 라인)와 1단계의 드롭 · 스택 보충. 확인 2026-10-21(robots + 약관).
# mode 는 sources.yaml 과 같다. fetch 만 catalog/local/fetch.mjs 가 받는다. 사실 수치만 쓰고 필드마다 출처 URL 을 남긴다.
# 약관 기록(verdict · basis · clauses · read_at · robots)의 꼴과 규칙은 docs/01a_catalog_sources.md 1-2b. 약관 전문은 저장하지 않는다.
#   2026-11-15 BITR · RSG 부터 채웠다. fetch.mjs 는 줄 단위로 host · mode 만 읽으므로 기록 안에 host · mode 라는 키를 쓰지 않는다.
