        text: |
          … BR grants you a non-transferable, non-exclusive and non-sublicensable limited right and license to view, use and access the BR Platform to (a) incidentally view, print and download the images, text, graphics, photographs, audio, video and other content available within the BR Platform solely for your informational purposes and for your immediate, private, personal and non-commercial use, …
      - where: 'Use of the BR Platform, 둘째 문단 (금지 (i) · (ii) · (iii))'
        supports: '문장 · 표 · 번역은 옮기지 않는다'
        text: |
          … you agree not to: (i) reverse engineer, decompile, reverse compile, translate, adapt, or disassemble or otherwise access the BR Platform, or any part thereof; (ii) copy, distribute, display, transmit or reproduce the BR Platform, or any part thereof, in any form; (iii) publish, display, disclose, sell, rent, lease, modify, store, loan, distribute, publicly display or perform, co-brand, frame, permit third parties to link to, or create compilations or derivative works of the BR Platform, or any part thereof; …
      - where: 'Intellectual Property (편집물 권리 주장)'
        supports: '수치(사실 값)는 쓴다'
        text: |
          The compilation and arrangement of all content, data and other information found within the BR Platform is also the sole and exclusive property of BR and its licensors and is protected by U.S. and international intellectual property laws.
      - where: 'Disruptive Behavior (자동화에 닿는 유일한 조항, 봇은 IRC 봇뿐)'
        supports: '자동으로 읽어도 된다'
        text: |
