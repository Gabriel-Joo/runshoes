# batch 프로필 — 요약 CronJob(runshoes-summary)이 쓴다. 같은 이미지 · 같은 main, args: --spring.profiles.active=batch
# 웹 Pod 와 다른 점만 둔다. 같은 점검을 새 배치에도: 웹 서버 · Flyway · 기동 때 저절로 도는 것(ApplicationRunner · @Scheduled)
#   - 웹 서버를 띄우지 않는다
#   - Flyway 를 끈다 — 스키마는 웹 Pod 의 Sync 만 바꾼다. ddl-auto: validate 는 남아 스키마가 맞지 않으면 바로 실패한다
#   - SeedPasswords · ActivityCleanup 은 @Profile("!batch")
spring:
  main:
    web-application-type: none
  flyway:
    enabled: false
