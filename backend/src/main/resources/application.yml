# 기본값은 로컬 개발(docker compose 의 MySQL 127.0.0.1:3307). 클러스터는 env 로 덮어쓴다(Phase 5.2).
server:
  port: ${SERVER_PORT:${PORT:3000}}
  # BASE_PATH 는 config/BasePathConfig 가 context-path 로(끝의 / 를 뗀다)
  compression.enabled: true
  shutdown: graceful                  # SIGTERM 에 처리 중인 요청을 마치고 내린다(롤링 · preStop 5초 뒤)

spring:
  lifecycle.timeout-per-shutdown-phase: 20s   # terminationGracePeriodSeconds 30 안에서
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/runshoes?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:runshoes}
    password: ${SPRING_DATASOURCE_PASSWORD:runshoes}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  web.resources.add-mappings: false   # 정적 파일은 config/SpaConfig 하나만(Boot 기본 /** 매핑과 겹치지 않게)
  jpa:
    hibernate.ddl-auto: validate      # 스키마는 Flyway 가 가진다
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  # 로그인(docs/04_auth.md) — 값은 Secret runshoes-auth 에서 env 로. 기본값이 없다: JWT_SECRET 이 없으면 뜨지 않는다
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
    cookie-secure: ${AUTH_COOKIE_SECURE:true}     # 로컬 http 에서만 false
    seed-user-password: ${SEED_USER_PASSWORD:}
    admin-password: ${ADMIN_PASSWORD:}
    # 체험 카드(시드 3 + 데모 관리자, docs/04_auth.md) — 기본 꺼짐. 끄면 GET /api/auth/demo-accounts · POST /api/auth/demo 가 404
    demo-login-enabled: ${DEMO_LOGIN_ENABLED:false}
  # 로그인 시도 제한 · 활동 로그(docs/04_auth.md)
  ratelimit:
    login-account: 5        # 같은 계정(이메일) 15분에 실패 5번 → 마지막 실패에서 15분
    login-ip: 20            # 같은 IP 15분에 실패 20번
    login-window: 15m
    signup-ip: 10           # 같은 IP 1시간에 가입 10건
    signup-window: 1h
    demo-ip: 30             # 같은 IP 15분(login-window)에 체험 로그인 30번
  activity:
    retention-auth: 90d     # auth.* · user.*
    retention-other: 180d   # review.* · like.* · review_like.* · shoe.* · compare.*
    cleanup-cron: ${ACTIVITY_CLEANUP_CRON:0 0 4 * * *}   # 매일 04:00(Asia/Seoul)
    warn-rows: 500000       # 남은 행이 넘으면 정리 job 이 WARN
  static-path: ${APP_STATIC:/opt/app/static}   # Vite dist — config/SpaConfig
  ollama:
    url: ${OLLAMA_URL:http://localhost:11434}
    model: gemma4:e4b
    timeout-ms: 40000

management:
  # actuator 는 관리 포트(9000)에만 — Service · Ingress 에 싣지 않아 바깥에서 닿지 않는다. 3000 에는 /actuator/** 가 없다(관측 작업 A-2 3단계, 2026-11-14).
  # Prometheus 는 Pod 주석(prometheus.io/port 9000 · path /actuator/prometheus)으로 Pod IP 에 바로 붙는다(docs/06_deployment.md 1-9)
  server.port: 9000   # 로컬에서 겹치면 env MANAGEMENT_SERVER_PORT 로 바꾼다
  endpoints.web.exposure.include: health,prometheus
  # 응답 시간 버킷은 넷만(50ms · 100ms · 300ms · 1s, 사용자 2026-11-14). percentiles-histogram 은 켜지 않는다 —
  # 켜면 주소 · 메서드 · 상태 조합마다 버킷이 70개쯤 생겨 시계열이 크게 는다(인프라 조건). p50 · p95 는 이 넷에서 어림한 값이다
  metrics.distribution.slo.http.server.requests: 50ms,100ms,300ms,1s
  endpoint.health:
    probes.enabled: true
    # 앱 포트(3000)에 /livez · /readyz 를 둔다 — /actuator/health/liveness · readiness 와 같은 그룹(A-2 1단계).
    # actuator 가 9000 으로 옮겨 가도 이 둘은 3000 에 남는다 — 프로브(인프라 deployment.yaml) · 챗봇 준비 확인이 본다
    probes.add-additional-paths: true
    group.readiness.include: readinessState,db   # 이게 있어야 readiness 가 DB 를 본다(기본은 readinessState 만)
