[[topic]]
slug = "00_overview"
title = "한눈에 — RUNSHOES가 무엇인가"
about = "러닝화를 고르는 서비스가 무엇이고 어떤 구조로 도는지. 다룰 것 — ① 문제와 사용자(스펙 · 발볼 · 리뷰를 한곳에서) ② 화면 흐름(찾기 → 카드 → 상세 모달, 맞춤 추천 · 러너들의 선택 · 관리 화면) ③ 구조도: React · Spring Boot · MySQL · 챗봇(Ollama)을 자체 클러스터에, 배포는 Jenkins → Harbor → ArgoCD ④ 숫자: 운영 신발 수 · 커밋 수 · 스키마 V1 ~ V13 · 문서 ⑤ 뒤 글 일곱 편 안내. 화면 사진(홈 · 상세 모달 · 관리 화면)이 있으면 좋다 — 운영 사이트에서, 계정 · 개인정보가 찍히지 않게"
sources = ["README.md", "docs/README.md", "docs/overview.md", "docs/requirements.md", "docs/HISTORY.md", "docs/02_screens.md", "docs/03_admin.md"]
screenshots = true

[[topic]]
slug = "01_cicd"
title = "CI/CD — push 한 번이면 배포된다"
about = "이 저장소의 push 가 운영 Pod 가 되기까지를 직접 만든 과정. 다룰 것 — ① 흐름: GitHub 웹훅(+ 폴링 15분 안전망) → Jenkins(BuildKit rootless, 특권 없이) → Harbor(태그 = 커밋 12자리, latest 없음) → ronanlab-infra newTag 커밋(deploy key, 3번 재시도) → ArgoCD 자동 Sync ② Pull 형(GitOps)을 고른 까닭 — Jenkins 가 클러스터 권한을 갖지 않는다, 배포된 것의 답이 Git 에, 롤백은 git revert ③ 함정과 고친 것: 인프라 저장소를 git 단계로 받으면 태그 push 가 빌드를 다시 부르는 루프, 비밀값을 Groovy 문자열에 넣지 않기, Spring 이미지 빌드 메모리(실측 2.4GiB · limit 3Gi) ④ 학교 환경(kaniko · std-harbor · BUILD_NUMBER 태그)에서 자체 클러스터로 옮긴 것(2026-10-18) ⑤ 폴링 2분 → 웹훅(Access 에 막혀 있던 것을 /github-webhook/ 만 Bypass) ⑥ 정전 뒤 Jenkins 가 죽었는데 조용했던 일과 FOREMAN 빌드 알림 ⑦ 문서만 바뀐 커밋도 이미지를 새로 굽던 것을 건너뛰게 한 판단(이 일이 끝나면 — .dockerignore 가 docs · *.md 를 이미 빼고 있어 이미지 내용은 같았다)"
sources = ["Jenkinsfile", "Dockerfile", "Dockerfile.chatbot", ".dockerignore", "docs/06_deployment.md", "docs/archive/DEPLOY.md", "docs/archive/INFRA.md",
           "infra:platform/jenkins/values.yaml", "infra:apps/runshoes/kustomization.yaml", "infra:apps/runshoes/app.yaml", "infra:bootstrap/root-app.yaml",
           "foreman-log:stage8_cicd_result.md", "foreman-log:infra_20261106_jenkins-harbor-after-outage.md"]

[[topic]]
slug = "02_schema_deploy"
title = "스키마 변경 배포 — 자동 Sync를 끄는 순간"
about = "평소에는 자동으로 배포하고, 되돌릴 수 없는 순간에만 사람이 문을 연다. 다룰 것 — ① Sync 가 곧 마이그레이션 적용(Flyway) — MySQL DDL 은 트랜잭션이 아니다 ② 런북 순서: 자동 Sync 끄기(automated 없음 확인) → 덤프 → Sync → Pod 로그 · 공개 API · 행 수 → 다시 켜기 ③ 마이그레이션은 추가만 — 옛 이미지가 새 스키마에서 뜬다, 적용된 V*.sql 은 한 글자도 안 고친다(체크섬) ④ 이미지에 든 마이그레이션 확인 스크립트 ⑤ V3 ~ V13 일곱 번의 실행 기록(V6 ~ V9 는 한 번에 — 끄고 켜기를 줄이려고) ⑥ 자동 Sync 상태를 확인하지 않고 보고했다가 바로잡은 일 → 매번 syncPolicy · 이미지 태그 · Pod 로그를 읽고 보고"
sources = ["docs/06_deployment.md", "docs/07_database.md", "backend/src/main/resources/db/migration",
           "infra:apps/runshoes/runbooks/auth-v3.md", "infra:apps/runshoes/runbooks/catalog-v4-v5.md", "infra:apps/runshoes/runbooks/admin-demo-v6-v9.md",
           "infra:apps/runshoes/runbooks/v10-auto-increment.md", "infra:apps/runshoes/runbooks/v11-admin-history.md",
           "infra:apps/runshoes/runbooks/v12-wide-scope.md", "infra:apps/runshoes/runbooks/v13-model-en.md",
           "infra:apps/runshoes/scripts/check-image-migrations.sh"]

[[topic]]
slug = "03_spring_cutover"
title = "Spring 전환 — 계약 시험으로 끊김 없이 옮기기"
about = "운영 중인 Node(json-server) 백엔드를 Spring Boot + MySQL 로 바꾸면서 화면은 한 줄도 바꾸지 않은 과정(2026-11-09 사용자 — 따로 보여 줄 가치). 다룰 것 — ① 계약 녹화: 옛 서버의 응답을 시나리오로 녹화해 정답(baseline)으로, 새 서버를 같은 시나리오로 돌려 diff(계약 v6 PASS 85) ② 계약을 지키려고 생긴 설계(id max+1 · 중복 id · DOUBLE · CORS 반사 등)와 그 근거 ③ 전환 순서: MySQL 먼저 선택 Sync → 앱 이미지 · Deployment 를 Sync 한 번에 — 새 이미지가 DB 설정 없이 뜨는 창이 없게 ④ 2026-10-21 01:39 KST 전환 중 공개 /api/terms 1초마다 90회 — 실패 0, 롤링 겹침 2초 동안 Node 와 Spring 이 번갈아 응답 ⑤ 되돌리기 길(Node 이미지 + PVC db.json)을 V3 뒤에 닫은 판단 ⑥ 챗봇 요약 시험은 Ollama 를 실제로 부르지 않고 mock 으로"
sources = ["docs/05_api_contract.md", "docs/06_deployment.md", "docs/07_database.md", "docs/archive/SPRING_MIGRATION_PLAN.md", "docs/archive/API_CONTRACT.md",
           "contract/README.md", "contract/scenarios.mjs", "contract/diff.mjs", "contract/run-spring-local.sh"]

[[topic]]
slug = "04_auth"
title = "로그인 · 데모 관리자 · 시도 제한"
about = "포트폴리오로 공개하는 서비스에서 계정과 관리 화면을 어떻게 지켰나. 다룰 것 — ① 권한은 서버가 막는다(화면의 경로 가드는 안내용) ② 데모 관리자 — 관리 화면을 누구나 둘러보되 쓰기는 서버가 거절 ③ 로그인 시도 제한 · 활동 로그 ④ 비밀번호 · 비밀값을 명령줄 · 로그 밖에(적재 스크립트가 Secret 을 스크립트 안 변수로만 읽는 것 포함) ⑤ 탈퇴 · 소프트 삭제(V8 · V9)"
