[[topic]]
slug = "05_catalog"
title = "카탈로그 — 출처가 달린 신발 데이터"
about = "300켤레 남짓의 스펙을 어디서 읽고 어떻게 믿을 수 있게 했나. 다룰 것 — ① 약관 · robots 를 먼저 읽고 수집처를 정한 것(fetch · blocked · unknown, 막힌 곳은 우회하지 않는다) ② 칸별 출처 순위(공식몰 → 리뷰 스펙 상자 → 본문), 기본값으로 메우지 않는다 ③ 출처가 갈릴 때 — 무게는 작은 차이만 자동, 스택 · 드롭은 사람이 본다, 다수 쪽이 있으면 남기고 flag ④ 사람 판단과 Claude 판단을 칸마다 나눠 기록(by · via) — 검증은 Claude 가 판단한 값만 ⑤ 사진은 저장하지 않고 핫링크, 같은 모델 다른 색상은 실루엣 대조(IoU 0.80) ⑥ 숫자: 후보 행 · 운영 켤레 · 판단 칸 · 출처 링크 점검(다시 세어서)"
sources = ["docs/01a_catalog_sources.md", "docs/01b_catalog_images.md", "catalog/sources.yaml", "docs/HISTORY.md", "docs/archive/CATALOG_PIPELINE.md"]

[[topic]]
slug = "06_loader"
title = "적재기 — 관리자의 수정을 덮지 않는다"
about = "카탈로그를 운영에 넣는 도구가 사람이 관리 화면에서 고친 값을 되돌리지 않게 만든 과정. 다룰 것 — ① DB 가 아니라 관리자 API 로만 쓴다(앱 검증을 그대로 탄다) ② 칸마다 '누가 고쳤나'를 저장하는 대신 적재 직후 스냅숏과의 차이로 알아본다 — 스키마를 바꾸지 않고 ③ 사람의 수정을 찾으면 멈추던 것 → 끌어와서 진행(2026-10-30 사용자) ④ 실제로 막을 뻔한 일들(덤프 복원 뒤 96칸, 끊긴 적재, 대표 사진 → 품번, 출처 묶음째 굳은 와이드) ⑤ 기본은 건조 실행, 비밀번호는 스크립트 안에서만, 적용 뒤 건조 실행 0 ⑥ 적재기의 수정은 수정 이력에 남기지 않는다"
sources = ["docs/01c_catalog_loader.md", "scripts/load-prod.sh", "catalog/load.mjs", "catalog/pull-admin.mjs", "docs/HISTORY.md"]

[[topic]]
slug = "07_working_with_ai"
title = "AI와 같이 만든 방식"
about = "이 서비스의 코드 · 데이터 · 문서 대부분을 Claude Code 와 만들면서 사람이 무엇을 정하고 무엇을 확인했나. 다룰 것 — ① 판단을 사람과 Claude 로 나눠 남긴다 — 사람이 정한 값은 다시 검증하지 않는다 ② 문장마다 근거를 단 설명문과 기계 검사기(01d) — 넘겨짚기는 사람이 읽어 잡는다 ③ 상태를 추정으로 보고하지 않는다(자동 Sync 오보 뒤의 규칙) ④ 자동 압축으로 잊은 지시를 재고 인계 · 문서로 메운 것 ⑤ 운영 쓰기(적재 · Sync)는 사람이 누른다 — 권한 판단기와 스크립트 허용 규칙 ⑥ 지금 규칙만 쓰는 문서와 바뀐 과정을 모은 3절 · HISTORY. 일반론(\"소통이 중요했다\")이 아니라 사람이 바로잡은 자리를 앞에"
sources = ["docs/01d_catalog_copy.md", "docs/01a_catalog_sources.md", "docs/01c_catalog_loader.md", "docs/README.md", "docs/HISTORY.md", "CLAUDE.md",
