# RUNSHOES 포트폴리오 주제. FOREMAN 서기실 「포트폴리오 쓰기」가 주제를 하나 골라 서기에게 맡긴다.
# 결과는 portfolio/<slug>.md, Notion 런슈즈 [포트폴리오]에 이 순서로 게시한다.
# sources: 서기가 먼저 읽을 재료. 접두어 없는 경로는 이 저장소다.
#
# 2026-11-19 사용자: 화면 축 열 편으로 바꿨다(FOREMAN docs/manuscript_rules.md 5절). 한 편이 화면 하나이고, 화면을 먼저 보이고
#   그 화면이 무엇을 해 주는지 말한 뒤 기능 단위로 들어간다. 왜, 버린 것, 막힌 것은 기술문서 원고(notion/)의 몫이라 편 끝에 그
#   원고로 링크 한 줄을 건다. 한계 편만 결정으로 묶는다. 얕게, 짧게, 경어체.
#   기술문서 원고 25편이 이미 코드와 맞춰져 있어 새로 조사하지 않고 거기서 줄이고 고른다.
#   11-09에 적어 둔 옛 주제 여덟(CI/CD, 스키마 변경 배포, Spring 전환, 로그인, 카탈로그, 적재기, AI와 같이 만든 방식)은 결정 중심이라
#   화면 축에서는 편이 되지 않는다. Spring 전환과 배포는 00에서 짧게 말하고 기술문서로 넘긴다.
# 사진: portfolio/img/<slug>_<이름>.jpg 또는 .png, 운영 사이트를 찍는다. 실제 가입자의 이메일과 글이 보이는 관리 화면 탭(회원, 대화 보기, 문의)은
#   찍지 않고, 체험 계정 이메일은 가린다(2026-11-19 사용자).
# 쓰지 않는 재료: catalog/local/ (git 밖 작업 파일, 숫자는 docs 와 원고를 근거로).

[[topic]]
slug = "00_overview"
title = "한눈에 보는 RUNSHOES"
about = "무엇을 왜 만들었고, 화면 여덟과 그 뒤 구조를 한 장으로 보여 준다. Spring 전환과 배포는 화면이 없어 여기서 두세 문장으로 말하고 기술문서로 넘긴다"
sources = ["notion/00_overview.md", "notion/09_spring.md", "notion/10_deploy.md"]
screenshots = true

