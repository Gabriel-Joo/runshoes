# 문서 규칙(FOREMAN 문서 도구가 읽는다, tools/docs.py). 없는 칸은 FOREMAN 기본값. 본은 ronanlab-infra .foreman/docs.toml
# 2026-11-17 런슈즈 문서를 FOREMAN 문서 도구 위로 옮기는 1단계. 원고는 지금 docs/ 20편(노션 「기술문서」 20편과 일대일)
records = ["log/", "docs/archive/"]   # 기록 폴더. 문서도 아니고 걸게 하지도 않는다(log/ 작업 기록 셋, docs/archive/ 옛 계획서)
pair_numbers = false                  # 짝이 될 원고 폴더(notion/)가 아직 없다(5단계)
read_commit = "piece"                 # 읽은 커밋은 편마다 따로
allowed_domains = ["ronanlab.dev"]
# 바뀌어도 코드로 세지 않는 것: 글, 화면 사진과 신발 이미지, 잠금 파일, 빌드와 도구 설정, 저장소 규칙(2026-11-17 사용자, 문서로 설명할 까닭이 없다)
not_code = [".md", ".png", ".jpg", ".lock", "*package-lock.json", "*package.json", "tsconfig*.json", "*vite.config.ts", "*eslint.config.js",
            ".gitignore", ".claude/*", ".foreman/*"]

[sets]
docs = "docs/"
notion = "notion/"                    # 사람이 읽는 노션 원고(2026-11-17 5단계에서 새로 씀). 차례는 docs/style_guide.md 1절

[check]
sets = ["docs", "notion", "portfolio"]  # portfolio/ 는 FOREMAN 기본 묶음(인프라와 같다). 포트폴리오 원고 열 편(2026-11-19)
numbered_only = []                    # 번호 없는 편(README, requirements, overview, HISTORY, TODO)도 노션에 나가므로 20편 모두 본다
head_at = "top"
fenced = true
kinds = ["c", "docs", "code"]
files_at = "read"
claim = '\d|“|”'
claim_min = 0
banned = ["notion", "portfolio"]      # 금지어(IP, 도메인, 홈 경로, 토큰 꼴, 포트)는 사람이 읽는 원고에만 건다. docs는 내부 주소를 써도 된다
cover_by = ["docs"]
dashdot_base = "606b730"              # 새 줄 em dash와 가운뎃점 검사의 기준 커밋. 넣은 때의 런슈즈 main(2026-11-17). 기존 줄은 3단계에서
